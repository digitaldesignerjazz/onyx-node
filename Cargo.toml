[package]
name = "onyx-node"
version = "0.2.0-alpha.1"
edition = "2021"
authors = ["Sven Normen Esslinger <Esslinger & Co.>"]
description = "Onyx Node — durable independent-mesh edge node for the Nexus lineage"
license = "Apache-2.0"
repository = "https://github.com/digitaldesignerjazz/onyx-node"

[features]
default = ["listen"]
# Live `onyx-node listen` over nxmesh (libp2p gossipsub, Noise + QUIC/TCP).
listen = ["dep:libp2p", "dep:futures"]
# Legacy placeholder flag for publish.rs (one-shot pulse path).
nxmesh = []

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"

# nxmesh wire stack for `listen`. The nxmesh crate itself (nexus/mesh/noise-quic)
# does not compile yet (node.rs:92 `?` on gossipsub::Behaviour::new's &str error),
# so src/mesh_proto.rs carries a wire-compatible copy of MeshMessage.
# Swap to: nxmesh = { git = "https://github.com/digitaldesignerjazz/nexus", branch = "main" }
# once it builds. Keep libp2p on the same version as nxmesh.
libp2p = { version = "0.54", optional = true, features = ["tokio", "noise", "tcp", "quic", "dns", "yamux", "gossipsub", "identify", "ping", "mdns", "macros"] }
futures = { version = "0.3", optional = true }

[package.metadata.deb]
maintainer = "digitaldesignerjazz <135103659+digitaldesignerjazz@users.noreply.github.com>"
copyright = "2026, Sven Normen Esslinger / Esslinger & Co."
license-file = ["LICENSE", "0"]
section = "net"
priority = "optional"
extended-description = """\
Onyx Node: durable independent-mesh edge node for the Nexus lineage.
Alpha: 'onyx-node listen' joins the nxmesh gossipsub topic nexus/mesh/v0,
records incoming pulses and sends counter-pulses."""
assets = [
  ["target/release/onyx-node", "usr/bin/onyx-node", "755"],
  ["README.md", "usr/share/doc/onyx-node/README.md", "644"],
  ["CHANGELOG.md", "usr/share/doc/onyx-node/CHANGELOG.md", "644"],
  ["docs/LISTEN.md", "usr/share/doc/onyx-node/LISTEN.md", "644"],
  ["scripts/start-listen.sh", "usr/share/doc/onyx-node/examples/start-listen.sh", "755"],
  ["scripts/watchdog.sh", "usr/share/doc/onyx-node/examples/watchdog.sh", "755"],
]

[lib]
name = "onyx_node"
path = "src/lib.rs"

[[bin]]
name = "onyx-node"
path = "src/bin/onyx-node.rs"
