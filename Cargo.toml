[package]
name = "onyx-node"
version = "0.1.0"
edition = "2021"
authors = ["Sven Normen Esslinger <Esslinger & Co.>"]
description = "Onyx Node — durable independent-mesh edge node for the Nexus lineage"
license = "Apache-2.0"
repository = "https://github.com/digitaldesignerjazz/onyx-node"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"

[lib]
name = "onyx_node"
path = "src/lib.rs"

[[bin]]
name = "onyx-node"
path = "src/bin/onyx-node.rs"
