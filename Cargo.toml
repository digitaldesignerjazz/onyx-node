[package]
name = "onyx-node"
version = "0.1.1"
edition = "2021"
authors = ["Sven Normen Esslinger <Esslinger & Co.>"]
description = "Onyx Node — durable independent-mesh edge node for the Nexus lineage"
license = "Apache-2.0"
repository = "https://github.com/digitaldesignerjazz/onyx-node"

[features]
default = ["listen"]
# Live `onyx-node listen` over nxmesh (libp2p gossipsub, Noise + QUIC/TCP).
listen = ["dep:libp2p", "dep:futures"]
# Legacy placeholder flag for publish.rs (one-shot pulse path).
nxmesh = []

[dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
hex = "0.4"
rand = "0.8"

# nxmesh wire stack for `listen`. The nxmesh crate itself (nexus/mesh/noise-quic)
# does not compile yet (node.rs:92 `?` on gossipsub::Behaviour::new's &str error),
# so src/mesh_proto.rs carries a wire-compatible copy of MeshMessage.
# Swap to: nxmesh = { git = "https://github.com/digitaldesignerjazz/nexus", branch = "main" }
# once it builds. Keep libp2p on the same version as nxmesh.
libp2p = { version = "0.54", optional = true, features = ["tokio", "noise", "tcp", "quic", "dns", "yamux", "gossipsub", "identify", "ping", "mdns", "macros"] }
futures = { version = "0.3", optional = true }

[lib]
name = "onyx_node"
path = "src/lib.rs"

[[bin]]
name = "onyx-node"
path = "src/bin/onyx-node.rs"
