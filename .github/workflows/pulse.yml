name: Onyx Pulse

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Prefer real box pulse or generate seed
        id: hb
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          mkdir -p status

          # Keep a real (non-seed) pulse if it exists and is younger than 12 hours
          KEEP_REAL=false
          if [[ -f status/last_pulse.json ]]; then
            NODE_ID=$(jq -r '.node_id // empty' status/last_pulse.json 2>/dev/null || true)
            TS=$(jq -r '.ts // empty' status/last_pulse.json 2>/dev/null || true)
            if [[ -n "$NODE_ID" && "$NODE_ID" != "onyx-seed" && -n "$TS" ]]; then
              # Compare age (seconds)
              NOW=$(date -u +%s)
              PULSE_EPOCH=$(date -u -d "$TS" +%s 2>/dev/null || echo 0)
              AGE=$((NOW - PULSE_EPOCH))
              if [[ $AGE -lt 43200 ]]; then   # 12 hours
                KEEP_REAL=true
                echo "Keeping real pulse from $NODE_ID (age ${AGE}s)"
              fi
            fi
          fi

          if [[ "$KEEP_REAL" == "true" ]]; then
            # Touch only the envelope timestamp if needed, leave the real pulse intact
            jq --arg ts "$TIMESTAMP" '.ts = $ts' status/last_mesh_envelope.json > status/last_mesh_envelope.json.tmp 2>/dev/null || true
            if [[ -f status/last_mesh_envelope.json.tmp ]]; then
              mv status/last_mesh_envelope.json.tmp status/last_mesh_envelope.json
            else
              cat > status/last_mesh_envelope.json << EOF
          {
            "type": "AgentHeartbeat",
            "payload": {
              "agent": "onyx-node",
              "node_id": "$(jq -r .node_id status/last_pulse.json)",
              "status": "alive",
              "ts": "$TIMESTAMP"
            }
          }
          EOF
            fi
            echo "source=real" >> "$GITHUB_OUTPUT"
          else
            # Fallback seed
            cat > status/last_pulse.json << EOF
          {
            "agent": "onyx-node",
            "node_id": "onyx-seed",
            "independent_id": "independent:00000000000000000000000000000000",
            "status": "alive",
            "ts": "$TIMESTAMP",
            "extra": {
              "prototype": "Onyx Node",
              "plane": "independent",
              "topic": "nexus/mesh/v0",
              "transport": "none",
              "repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}",
              "note": "seed fallback (no fresh real pulse)"
            }
          }
          EOF
            cat > status/last_mesh_envelope.json << EOF
          {
            "type": "AgentHeartbeat",
            "payload": {
              "agent": "onyx-node",
              "node_id": "onyx-seed",
              "status": "alive",
              "ts": "$TIMESTAMP"
            }
          }
          EOF
            echo "source=seed" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit pulse status
        run: |
          git config user.name "Onyx Node Pulse"
          git config user.email "onyx-node[bot]@users.noreply.github.com"
          git add status/last_pulse.json status/last_mesh_envelope.json
          git diff --staged --quiet || git commit -m "chore(pulse): ${{ steps.hb.outputs.source }} pulse @ ${{ steps.hb.outputs.timestamp }}"
          git push
        continue-on-error: true
