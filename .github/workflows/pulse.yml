name: Onyx Pulse

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  pulse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate public pulse
        id: hb
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          mkdir -p status
          cat > status/last_pulse.json << EOF
          {
            "agent": "onyx-node",
            "node_id": "onyx-seed",
            "independent_id": "independent:00000000000000000000000000000000",
            "status": "alive",
            "ts": "$TIMESTAMP",
            "extra": {
              "prototype": "Onyx Node",
              "plane": "independent",
              "topic": "nexus/mesh/v0",
              "transport": "none",
              "repo": "${{ github.repository }}",
              "run_id": "${{ github.run_id }}"
            }
          }
          EOF
          cat > status/last_mesh_envelope.json << EOF
          {
            "type": "AgentHeartbeat",
            "payload": {
              "agent": "onyx-node",
              "node_id": "onyx-seed",
              "status": "alive",
              "ts": "$TIMESTAMP"
            }
          }
          EOF
      - name: Commit pulse status
        run: |
          git config user.name "Onyx Node Pulse"
          git config user.email "onyx-node[bot]@users.noreply.github.com"
          git add status/last_pulse.json status/last_mesh_envelope.json
          git diff --staged --quiet || git commit -m "chore(pulse): Onyx Node alive @ ${{ steps.hb.outputs.timestamp }}"
          git push
        continue-on-error: true
