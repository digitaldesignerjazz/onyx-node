# Onyx Node example config — safe to publish.
# Copy to config/onyx.toml for local use. That file is gitignored.

[node]
id = "onyx-hannover-01"
plane = "independent"

[pulse]
interval_secs = 30
status_dir = "status"
state_dir = "state"

[mesh]
topic = "nexus/mesh/v0"
# transport = "none" | "tailscale" | "netbird" | "yggdrasil"
transport = "none"
# fingerprint is a public hint only. never an auth key.
# fingerprint = "onyx-hannover-01.ts.net"

[wizard_q]
enabled = false
mode = "dry-run"
